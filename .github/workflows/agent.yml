name: Gemini Agent

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Process Issue with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, re, requests

          api_key = os.environ.get("GEMINI_API_KEY")
          task = os.environ.get("ISSUE_TITLE", "") + "\n" + os.environ.get("ISSUE_BODY", "")

          if not os.path.exists("index.html"):
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write("<!DOCTYPE html><html><head><meta charset='UTF-8'></head><body><h1>Раскрой МДФ</h1></body></html>")

          with open("index.html", "r", encoding="utf-8") as f:
              current_code = f.read()

          prompt = f"""Ты — автономный веб-разработчик.
          Ниже представлен текущий код файла index.html:
          ```html
          {current_code}
          ```

          Задача от владельца:
          {task}

          ПРАВИЛА ОТВЕТА:
          1. Верни ИСКЛЮЧИТЕЛЬНО полный обновленный HTML-код от <!DOCTYPE html> до </html>.
          2. Не пиши никаких пояснений и комментариев.
          3. Не используй обрамление markdown (тройные кавычки). Только чистый код."""

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          resp = requests.post(url, json=payload, headers={"Content-Type": "application/json"})
          data = resp.json()

          if "candidates" not in data:
              print("Gemini API Error:", data)
              raise ValueError(f"API Error: {data.get('error', {}).get('message', 'Unknown error')}")

          result_code = data["candidates"][0]["content"]["parts"][0]["text"].strip()
          result_code = re.sub(r"^```(?:html)?\s*", "", result_code)
          result_code = re.sub(r"\s*```$", "", result_code)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(result_code)
          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "Auto-update via Gemini: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Reply and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Готово! Код обновлен и сохранен в ветку main.'
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
