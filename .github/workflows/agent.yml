name: Gemini Agent

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Issue with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, json, re, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")
          task = os.environ.get("ISSUE_TITLE", "") + "\n" + os.environ.get("ISSUE_BODY", "")
          
          with open("index.html", "r", encoding="utf-8") as f:
              current_code = f.read()

          prompt = f"""Ты — автономный веб-разработчик.
          Ниже представлен текущий код файла index.html инструмента для раскроя МДФ:
          ```html
          {current_code}
          ```

          Задача от владельца проекта:
          {task}

          Внеси требуемые изменения в код. 
          ПРАВИЛА ОТВЕТА:
          1. Верни ИСКЛЮЧИТЕЛЬНО полный обновленный HTML-код от <!DOCTYPE html> до </html>.
          2. Не пиши никаких пояснений, комментариев до или после кода.
          3. Не используй обрамление markdown (никаких тройных кавычек ```). Только чистый код."""

          url = f"[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=){api_key}"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode("utf-8"))
              result_code = data["candidates"][0]["content"]["parts"][0]["text"].strip()
              
              # Очистка, если модель добавила тройные кавычки
              result_code = re.sub(r"^```(?:html)?\s*", "", result_code)
              result_code = re.sub(r"\s*```$", "", result_code)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(result_code)
          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "Auto-update via Gemini: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Reply and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Готово! Код обновлен и отправлен в ветку main. Через минуту изменения будут видны на сайте.'
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
